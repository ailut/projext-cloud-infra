name: Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Show runner information
        run: |
          echo "Runner is working"
          uname -m
          whoami
          pwd
    
      - name: Check Floci connectivity
        run: |
          curl http://localhost:4566/_floci/health