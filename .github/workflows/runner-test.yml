name: Floci Runner Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runner:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Verify runner architecture
        run: |
          echo "Self-hosted runner is available"
          uname -m

      - name: Check Floci connectivity
        run: |
          curl --fail --silent --show-error http://localhost:4566/_floci/health
