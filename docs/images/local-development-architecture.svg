<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">projext-cloud-infra - Local Development Architecture</title>
  <desc id="desc">Terraform local development architecture showing VS Code, Terraform CLI, AWS Provider, shared Floci runtime, AWS CLI verification, and the projext S3 bucket.</desc>
  <defs>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#10243e}
