      .s{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#48627d}
      .note{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#29445f}
      .box{fill:#f7fbff;stroke:#3d6f9f;stroke-width:2}
      .inner{fill:#ffffff;stroke:#3488cf;stroke-width:2}
      .runtime{fill:#eef8ff;stroke:#1f82c9;stroke-width:3}
      .arrow{stroke:#2c7fc3;stroke-width:5;fill:none;marker-end:url(#a)}
      .arrow2{stroke:#2c7fc3;stroke-width:5;fill:none;marker-start:url(#a2);marker-end:url(#a)}
    </style>
