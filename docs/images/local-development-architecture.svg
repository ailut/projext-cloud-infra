<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">projext-cloud-infra - Local Development Architecture</title>
  <desc id="desc">Current Terraform local development architecture showing VS Code, Terraform workspaces, AWS Provider, shared Floci runtime, remote state, AWS CLI verification, and dev and qa S3 buckets.</desc>
  <defs>
    <style>
      .title{font:700 42px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#10243e}
      .h{font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#10243e}
      .t{font:600 21px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#17304f}
      .s{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#48627d}
      .note{font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#29445f}
      .box{fill:#f7fbff;stroke:#3d6f9f;stroke-width:2}
      .inner{fill:#ffffff;stroke:#3488cf;stroke-width:2}
      .runtime{fill:#eef8ff;stroke:#1f82c9;stroke-width:3}
      .state{fill:#fff8ec;stroke:#e59a21;stroke-width:3}
      .arrow{stroke:#2c7fc3;stroke-width:5;fill:none;marker-end:url(#a)}
      .arrow2{stroke:#2c7fc3;stroke-width:5;fill:none;marker-start:url(#a2);marker-end:url(#a)}
      .arrowO{stroke:#e59a21;stroke-width:5;fill:none;marker-end:url(#o)}
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2c7fc3"/></marker>
    <marker id="a2" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto"><path d="M12,0 L0,6 L12,12 z" fill="#2c7fc3"/></marker>
    <marker id="o" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e59a21"/></marker>
  </defs>

  <rect width="1600" height="930" fill="#ffffff"/>
  <text x="800" y="62" text-anchor="middle" class="title">projext-cloud-infra - Local Development Architecture</text>

  <rect x="55" y="115" rx="18" ry="18" width="300" height="165" class="box"/>
  <circle cx="125" cy="165" r="24" fill="#315d8a"/>
  <path d="M90 228c7-34 63-34 70 0v12H90z" fill="#315d8a"/>
  <g transform="translate(205 135)">
    <path d="M0 27 19 11 45 31 77 3 96 11 96 73 77 81 45 53 19 73 0 57 31 42Z" fill="#23A9F2"/>
    <path d="M45 31 77 3 96 11 96 73 77 81 45 53 62 42Z" fill="#168AD4"/>
    <path d="M19 11 45 31 31 42 0 27Z" fill="#1177BB"/>
    <path d="M19 73 45 53 31 42 0 57Z" fill="#1177BB"/>
    <path d="M62 42 77 29 77 55Z" fill="#EAF6FF" opacity=".95"/>
  </g>
  <text x="205" y="255" text-anchor="middle" class="t">Developer / VS Code</text>

  <rect x="430" y="115" rx="18" ry="18" width="300" height="165" class="box"/>
  <g transform="translate(522 140)" fill="#7354d8"><path d="M0 0l38 20v42L0 42z"/><path d="M43 22l38-22v42L43 63z"/><path d="M43 69l38-22v42l-38 21z"/></g>
  <text x="580" y="235" text-anchor="middle" class="t">Terraform CLI</text>
  <text x="580" y="260" text-anchor="middle" class="s">workspaces: dev / qa</text>

  <rect x="805" y="115" rx="18" ry="18" width="300" height="165" class="box"/>
  <text x="955" y="185" text-anchor="middle" style="font:700 66px Arial,sans-serif;fill:#243b53">aws</text>
  <path d="M900 201c38 29 90 31 133 5" stroke="#f59e0b" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="955" y="255" text-anchor="middle" class="t">AWS Provider</text>

  <path d="M355 198H425" class="arrow"/>
  <path d="M730 198H800" class="arrow"/>
  <path d="M955 280V328" class="arrow"/>

  <rect x="490" y="335" rx="22" ry="22" width="820" height="315" class="runtime"/>
  <text x="900" y="382" text-anchor="middle" class="h">Shared Floci Runtime</text>

  <rect x="525" y="435" rx="16" ry="16" width="235" height="165" class="inner"/>
  <g transform="translate(612 462)" fill="#355f8a"><rect x="0" y="0" width="62" height="18" rx="6"/><rect x="0" y="25" width="62" height="18" rx="6"/><rect x="0" y="50" width="62" height="18" rx="6"/><circle cx="12" cy="9" r="2.8" fill="#fff"/><circle cx="12" cy="34" r="2.8" fill="#fff"/><circle cx="12" cy="59" r="2.8" fill="#fff"/></g>
  <text x="642" y="555" text-anchor="middle" class="t">Floci Backend</text>
  <text x="642" y="583" text-anchor="middle" class="s">localhost:4566</text>

  <rect x="785" y="435" rx="16" ry="16" width="235" height="165" class="inner"/>
  <g transform="translate(875 465)" fill="#355f8a"><circle cx="28" cy="28" r="15" fill="#fff"/><path d="M28 0l7 8 10-2 3 10 10 3-2 10 8 7-8 7 2 10-10 3-3 10-10-2-7 8-7-8-10 2-3-10-10-3 2-10-8-7 8-7-2-10 10-3 3-10 10 2z" fill="#355f8a"/><circle cx="28" cy="28" r="11" fill="#fff"/></g>
  <text x="902" y="555" text-anchor="middle" class="t">Floci API</text>
  <text x="902" y="583" text-anchor="middle" class="s">localhost:4501</text>

  <rect x="1045" y="435" rx="16" ry="16" width="235" height="165" class="inner"/>
  <rect x="1120" y="462" width="84" height="55" rx="5" fill="none" stroke="#355f8a" stroke-width="6"/>
  <line x1="1162" y1="517" x2="1162" y2="534" stroke="#355f8a" stroke-width="6"/>
  <line x1="1140" y1="536" x2="1184" y2="536" stroke="#355f8a" stroke-width="6"/>
  <text x="1162" y="555" text-anchor="middle" class="t">Floci UI</text>
  <text x="1162" y="583" text-anchor="middle" class="s">localhost:4500</text>

  <rect x="85" y="405" rx="18" ry="18" width="300" height="195" class="state"/>
  <text x="235" y="450" text-anchor="middle" class="h">Remote State</text>
  <text x="235" y="483" text-anchor="middle" class="t">projext-terraform-state</text>
  <text x="115" y="527" class="s">env/dev/terraform.tfstate</text>
  <text x="115" y="558" class="s">env/qa/terraform.tfstate</text>
  <path d="M385 500H520" class="arrowO"/>

  <rect x="135" y="665" rx="18" ry="18" width="250" height="150" class="box"/>
  <rect x="200" y="695" width="88" height="58" rx="8" fill="#27496d"/>
  <text x="244" y="734" text-anchor="middle" style="font:700 28px monospace;fill:#fff">&gt;_</text>
  <text x="260" y="785" text-anchor="middle" class="t">AWS CLI</text>

  <rect x="505" y="690" rx="18" ry="18" width="450" height="125" class="box"/>
  <text x="730" y="733" text-anchor="middle" class="h">Application S3</text>
  <text x="730" y="767" text-anchor="middle" class="s">projext-dev-application-data</text>
  <text x="730" y="795" text-anchor="middle" class="s">projext-qa-application-data</text>

  <rect x="1080" y="690" rx="18" ry="18" width="360" height="125" class="box"/>
  <text x="1260" y="733" text-anchor="middle" class="h">Terraform Outputs</text>
  <text x="1260" y="767" text-anchor="middle" class="s">workspace-specific bucket name</text>
  <text x="1260" y="795" text-anchor="middle" class="s">workspace-specific bucket ARN</text>

  <path d="M385 740H500" class="arrow2"/>
  <path d="M955 752H1075" class="arrow"/>

  <rect x="35" y="865" width="1530" height="38" rx="12" fill="#f4f8fc" stroke="#b7cadc"/>
  <text x="800" y="891" text-anchor="middle" class="note">Terraform defines the infrastructure, Floci provides the local AWS-compatible runtime, and Floci UI provides visual verification.</text>
</svg>